[package]
name = "nabla"
version = "0.3.0"
license = "Apache-2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nabla_lib"
# The desktop binary links the Rust library directly; no mobile FFI archives.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` is what exposes the multiwebview API (`Window::add_child` +
# `WebviewBuilder`), the only way to host a second webview — a real embedded
# browser — inside the app's own window. Nothing else here uses the feature.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
# Native folder picker for the workspace add flow (S9).
tauri-plugin-dialog = "2"
# Native OS notifications with Nabla's own app icon and OS permission prompt.
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Bundled: compiles SQLite into the binary, no system dependency, cross-platform.
rusqlite = { version = "0.37", features = ["bundled"] }
# S2: model discovery is a native HTTP call. It runs in Rust so the webview never
# sees the api key and CORS/CSP stay out of the way. rustls keeps the build free
# of an OpenSSL system dependency.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
futures-util = "0.3"
# S3 (interactive login): `pi auth login` refuses to run without a TTY, so the
# interactive sessions need a real pseudo-terminal. wezterm's `portable-pty`
# exposes one API over Unix ptys and Windows ConPTY; `run` stays on plain pipes.
portable-pty = "0.9"
# `webview-control.md` T1: the MCP server the agent connects to in order to drive
# the embedded webview. `axum` is the HTTP binding (MCP streamable HTTP is POST +
# JSON over HTTP/1.1) and `tokio` the listener it serves on.
axum = "0.8"
tokio = { version = "1", features = ["rt", "net"] }
# 32 bytes of real entropy for the per-run bearer token that guards that endpoint.
getrandom = "0.3"
# S6 of `web-search.md`: the `Authorization: Basic` header of a configured SearXNG
# instance is base64 of `user:password`.
base64 = "0.23"
# Embedded local CPU ONNX inference for Moonshine STT and Kokoro 82M TTS.
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "tls-rustls"] }
ndarray = "0.17"
# Native cross-platform microphone capture (CoreAudio / WASAPI / ALSA) so STT
# never depends on WKWebView getUserMedia restrictions.
cpal = "0.15"
# Official Gradium Phonon 40M GGUF Rust runtime (in-process, zero Python).
ptts = { version = "0.7.1", default-features = false, features = ["hf"] }

[target.'cfg(target_os = "macos")'.dependencies]
ptts = { version = "0.7.1", default-features = false, features = ["hf", "accelerate"] }

# S5 (cross-platform kill): std exposes `Command::process_group` but no way to
# signal a process group, so reaping pi's descendants on Unix needs killpg/kill.
# `libc` is already in the dependency tree (tauri + rusqlite) and stays Unix-only.
[target.'cfg(unix)'.dependencies]
libc = "0.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# The macOS default for dev builds is `split-debuginfo = "unpacked"`, which
# makes rustc >= 1.88 emit per-codegen-unit objects (`*.rcgu.o`) with random
# suffixes on every rebuild: they are never overwritten and never collected
# (upstream rust-lang/rust#161824 — a case there grew 341 GB in 8 weeks). This
# machine's target/ held 12 GB of them before the first `cargo clean`.
# `packed` bundles debug info per artifact (the dSYM style Xcode uses) and does
# not accumulate stray objects.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
