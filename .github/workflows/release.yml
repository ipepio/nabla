name: Release

# Desktop bundles for the two non-macOS targets: an NSIS installer (.exe) for
# Windows and a .deb for Linux. Triggered by pushing a tag `v*`, so publishing
# stays an explicit human decision — a normal push to main never releases.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    strategy:
      fail-fast: false
      # One leg at a time: both legs attach to the same tag's release, and two
      # concurrent "create if missing" calls race on that tag. Serialising
      # costs a few minutes and removes the 422 that would otherwise lose a
      # bundle.
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            args: '--config src-tauri/tauri.bundle.conf.json --bundles nsis'
          - platform: ubuntu-24.04
            args: '--config src-tauri/tauri.bundle.conf.json --bundles deb'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # package.json pins `packageManager: pnpm@12.18.0`; corepack is the only
      # source of that version, exactly as in ci.yml.
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Tauri on Linux builds against the webkit/gtk stack; the rest are helpers
      # the .deb bundler and tauri icon tooling invoke.
      - name: Linux system packages
        if: matrix.platform == 'ubuntu-24.04'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          libwebkit2gtk-4.1-dev
          libgtk-3-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          librsvg2-bin
          libasound2-dev
          pkg-config
          file
          patchelf
          python3-pip
          dpkg

      - name: Install Tauri CLI
        run: pnpm dlx @tauri-apps/cli --version || true

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare embedded pi runtime (Node 22 + pi-coding-agent)
        run: node scripts/prepare-pi-runtime.mjs

      # Build the app and attach the bundles to the tag's GitHub release. A
      # third-party action is justified here: it is the documented bundling path
      # for the platform matrix and only wraps `tauri build --bundles`.
      - name: Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Nabla ${{ github.ref_name }}'
          releaseBody: >-
            Standalone installers with embedded Node 22 and the pi runtime —
            no external pi installation required. Assets: macOS Apple silicon
            (.dmg, unsigned: right-click → Open the first time) built locally
            on the tag, plus Windows (.exe, NSIS) and Linux (.deb, amd64) built
            by this tag's workflow.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # The run keeps the bundle it produced, in addition to the release
      # attachment above: `if-no-files-found: error` turns a leg that bundled
      # nothing into a red build instead of a release missing an installer.
      - name: Keep the bundle as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: nabla-${{ github.ref_name }}-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 30
